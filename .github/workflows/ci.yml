name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    name: read Go version from go.mod
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          v=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod | head -n 1)
          if [ -z "$v" ]; then echo "go.mod has no go directive" >&2; exit 1; fi
          echo "versions=[\"$v\"]" >> "$GITHUB_OUTPUT"

  go:
    name: Go ${{ matrix.go-version }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.matrix.outputs.go-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...

  cross-vet:
    name: cross vet (${{ matrix.goos }}, CGO off)
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ fromJSON(needs.matrix.outputs.go-versions)[0] }}
          cache: true
      - name: go vet for ${{ matrix.goos }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

  conformance:
    name: conformance vectors (Go runner)
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.matrix.outputs.go-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test -count=1 -v ./conformance/...

  python:
    name: python client (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest, replaying conformance vectors against the fake server
        working-directory: middleware/python
        run: python -m unittest discover -s tests -v

  node:
    name: node client (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test, replaying conformance vectors against the fake server
        working-directory: middleware/node
        run: node --test

  compat-matrix:
    name: compatibility matrix is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: regenerate docs/compatibility.md
        run: go run ./scripts/gen-compat-matrix > "$RUNNER_TEMP/compatibility.md"
      - name: fail when the committed file is stale
        run: diff -u docs/compatibility.md "$RUNNER_TEMP/compatibility.md"

  docker:
    name: docker image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gover
        name: read Go version from go.mod
        run: echo "go=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: docker build (no push)
        run: >-
          docker build
          --build-arg GO_VERSION=${{ steps.gover.outputs.go }}
          --build-arg VERSION=ci-${{ github.sha }}
          -t acd-ctx:ci .
      - name: smoke test against /__acd-ctx/health
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is not available on this runner; smoke test skipped"
            exit 0
          fi
          docker run -d --name acd-ctx-ci -p 127.0.0.1:8787:8787 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            acd-ctx:ci
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/__acd-ctx/health | grep -q '"ok":true'; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            echo "health endpoint did not answer"
            docker logs acd-ctx-ci || true
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.com' http://127.0.0.1:8787/__acd-ctx/health)
          if [ "$code" != 403 ]; then
            echo "Host guard let evil.com through (status $code)"
            exit 1
          fi
          # The plugin protocol has its own Host guard and bearer token.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.com' http://127.0.0.1:8787/__acd-ctx/plugin/status)
          if [ "$code" != 403 ]; then
            echo "plugin Host guard let evil.com through (status $code)"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/__acd-ctx/plugin/status)
          if [ "$code" != 401 ]; then
            echo "plugin endpoint without a token answered $code, want 401"
            exit 1
          fi
          docker exec acd-ctx-ci /acd-ctx healthcheck --port 8787
      - name: container logs on failure
        if: failure()
        run: docker logs acd-ctx-ci || true
      - name: remove container
        if: always()
        run: docker rm -f acd-ctx-ci >/dev/null 2>&1 || true
